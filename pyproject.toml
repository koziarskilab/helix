[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
include = '\.pyi?$'

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true

[tool.poetry]
name = "helix"
version = "1.0.0"
description = "Hit Expansion via Localized Exploration of Synthesizable Chemical Space"
authors = ["Walter Virany, Yidong Jin, Andrew Lian, Dmytro Shevchuk, Amir Mehdi Soufi Enayati, Mike Tyers, Robert A. Batey, Piotr Gaiński, Michał Koziarski"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch-geometric = "^2.5"
dgllife = "^0.3"
tqdm = "^4.66"
wandb = "^0.15"
gin-config = "^0.5"
pandas = "^2.1"
rdkit = "^2023.9"
numpy = "^1.26"
PyTDC = "^1.0"
molbo = { git = "https://github.com/wvirany/molbo.git", tag = "v0.3.0" }

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5"
pytest = "^7.4"
jupyter = "^1.0"
